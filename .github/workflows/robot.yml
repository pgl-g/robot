name: automatic-save-robot
on:
  schedule:
    # 每小时一次（UTC 整点）。GitHub 贡献图按天着色，次数越多格子越深。
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run
        run: |
          node -v
          node main.js
          ls -la pic/ | tail -5

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "feat: save robot"
          add: "pic/*"
          author_name: guxiaobiao
          author_email: 1801688332@qq.com
          committer_name: guxiaobiao
          committer_email: 1801688332@qq.com
